# En este archivo se registran todas las configuraciones de notificaciones y
# eventos que las generan en el sistema. Se recarga automáticamente en la aplicación
# cuando hay cambios.
#
# Ver más documentación en docs/notificaciones.md

# Para definir una configuración, hay que agregar una clave única en esta lista
# e indicar para qué roles se puede configurar, y si es administrable por el
# usuario. Si se agrega o cambia una configuración hay que correr el comando:
#   bin/rails notifications:sync
configurations:
  order_updates:
    roles: [consumer]
    configurable: true

  debt_alerts:
    roles: [consumer]
    configurable: false

  provider_payment_reminders:
    roles: [consumer]
    configurable: false

  automatic_payment_reminders:
    roles: [consumer]
    configurable: false

  company_payments:
    roles: [admin]
    configurable: true
  employee_debts:
    roles: [admin]
    configurable: true

  hr_pending_payments:
    roles: [admin]
    configurable: true

  hr_rejected_receipts:
    roles: [admin]
    configurable: true

  hr_partial_payments:
    roles: [admin]
    configurable: true

  hr_pending_invoices:
    roles: [admin]
    configurable: true

  hr_subsidy_changes:
    roles: [admin]
    configurable: true

  hr_payment_reminders:
    roles: [consumer]
    configurable: false

  provider_orders:
    roles: [provider]
    configurable: true

  provider_payments:
    roles: [provider]
    configurable: true

  order_cancellations:
    roles: [provider]
    configurable: true

  menu_publication_reminders:
    roles: [provider]
    configurable: true

  order_reminders:
    roles: [consumer]
    configurable: true

# En esta lista se definen los eventos que generan notificaciones. Para agregar
# uno, hay que especificar una de las claves de configuración de arriba en el
# atributo configuration, especificar un único rol de los que están disponibles
# para la configuración en role e indicar si requiere acción.
#
# IMPORTANTE: Cualquier cambio que se haga acá tiene que ser avisado a Juan
# Andrés Olmedo o Sebastián Rama. El content_sid es un identificador de Twilio.
# Si la descripción del evento tiene textos en singular y plural (one/other en
# es.yml), content_sid lleva una plantilla para cada uno, con las claves one y other.
# Si se quiere agregar un evento y probarlo en la app, se puede asignar un
# valor cualquiera a content_sid, pero avisar antes de que se mergee para
# corregirlo.
events:
  order_confirmation:
    configuration: order_updates
    role: consumer
    requires_action: false
    content_sid: HXa9afb0595862512cdcb61ead36bc9d6a

  order_rejection:
    configuration: order_updates
    role: consumer
    requires_action: false
    content_sid: HX732ee2e06cdb22417e5a986181f7e21c

  debt_threshold_exceeded:
