# En este archivo se registran todas las configuraciones de notificaciones y
# eventos que las generan en el sistema. Se recarga automáticamente en la aplicación
# cuando hay cambios.
#
# Ver más documentación en docs/notificaciones.md

# Para definir una configuración, hay que agregar una clave única en esta lista
# e indicar para qué roles se puede configurar, y si es administrable por el
# usuario. Si se agrega o cambia una configuración hay que correr el comando:
#   bin/rails notifications:sync
configurations:
  order_updates:
    roles: [consumer]
    configurable: true

  debt_alerts:
    roles: [consumer]
    configurable: false

  provider_payment_reminders:
    roles: [consumer]
    configurable: false

  automatic_payment_reminders:
    roles: [consumer]
    configurable: false

  company_payments:
    roles: [admin]
    configurable: true
  employee_debts:
    roles: [admin]
    configurable: true

  hr_pending_payments:
    roles: [admin]
    configurable: true

  hr_rejected_receipts:
    roles: [admin]
    configurable: true

  hr_partial_payments:
    roles: [admin]
    configurable: true

  hr_pending_invoices:
    roles: [admin]
    configurable: true

  hr_subsidy_changes:
    roles: [admin]
    configurable: true

  hr_payment_reminders:
    roles: [consumer]
    configurable: false

  provider_orders:
    roles: [provider]
    configurable: true

  provider_payments:
    roles: [provider]
    configurable: true

  order_cancellations:
    roles: [provider]
    configurable: true

  menu_publication_reminders:
    roles: [provider]
    configurable: true

  order_reminders:
    roles: [consumer]
    configurable: true

# En esta lista se definen los eventos que generan notificaciones. Para agregar
# uno, hay que especificar una de las claves de configuración de arriba en el
# atributo configuration, especificar un único rol de los que están disponibles
# para la configuración en role e indicar si requiere acción.
events:
  order_confirmation:
    configuration: order_updates
    role: consumer
    requires_action: false

  order_rejection:
    configuration: order_updates
    role: consumer
    requires_action: false

  debt_threshold_exceeded:
    configuration: debt_alerts
    role: consumer
    requires_action: true

  debt_payment_reminder:
    configuration: provider_payment_reminders
    role: consumer
    requires_action: true

  payment_available:
    configuration: automatic_payment_reminders
    role: consumer
    requires_action: false

  payment_due_soon:
    configuration: automatic_payment_reminders
    role: consumer
    requires_action: false

  employee_debt_overdue:
    configuration: employee_debts
    role: admin
    requires_action: false

  company_payment_upcoming:
    configuration: company_payments
    role: admin
    requires_action: true

  company_payment_overdue:
    configuration: company_payments
    role: admin
    requires_action: true

  company_payment_rejected:
    configuration: company_payments
    role: admin
    requires_action: true

  company_payment_approved:
    configuration: company_payments
    role: admin
    requires_action: false

  order_cancellation:
    configuration: order_cancellations
    role: provider
    requires_action: false

  provider_menu_unpublished:
    configuration: menu_publication_reminders
    role: provider
    requires_action: true

  hr_debt_payment_reminder:
    configuration: hr_payment_reminders
    role: consumer
    requires_action: false

  order_received:
    configuration: provider_orders
    role: provider
    requires_action: false

  payment_receipt_submitted:
    configuration: provider_payments
    role: provider
    requires_action: false

  order_deadline_reminder:
    configuration: order_reminders
    role: consumer
    requires_action: false
