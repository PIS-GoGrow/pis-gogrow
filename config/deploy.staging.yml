servers:
  web:
    - 18.228.27.215

ssh:
  user: ubuntu

# Con dominio propio: cambiar host y agregar https://<host>/auth/google_oauth2/callback en Google Cloud Console.
proxy:
  ssl: true
  host: 18-228-27-215.sslip.io

accessories:
  db:
    service: pis-gogrow-staging-db
    image: postgres:16
    host: 18.228.27.215
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: pis_gogrow
        POSTGRES_DB: pis_gogrow_staging
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - pis_gogrow_staging_postgres:/var/lib/postgresql/data

  # Panel de administración, en el mismo servidor que la app. Guarda su
  # configuración en una base propia: no toca la de la aplicación, a la que se
  # conecta desde su propia pantalla de ajustes.
  motoradmin-db:
    service: pis-gogrow-motoradmin-db
    image: postgres:17
    host: 18.228.27.215
    env:
      clear:
        POSTGRES_USER: motoradmin
        POSTGRES_DB: motoradmin
        # Sin contraseña a propósito: no publica ningún puerto, así que solo se
        # llega desde la red interna de Kamal.
        POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pis_gogrow_motoradmin_postgres:/var/lib/postgresql/data

  motoradmin:
    service: pis-gogrow-motoradmin
    image: motoradmin/motoradmin:latest
    host: 18.228.27.215
    # Detrás del mismo proxy que la app, con su propio nombre y su certificado:
    # así no hay que abrir otro puerto en el security group.
    proxy:
      host: motoradmin.18-228-27-215.sslip.io
      app_port: 3000
      ssl: true
    env:
      clear:
        DATABASE_URL: postgres://motoradmin@pis-gogrow-motoradmin-db:5432/motoradmin
      secret:
        - SECRET_KEY_BASE
