servers:
  web:
    - 18.228.27.215

ssh:
  user: ubuntu

# Con dominio propio: cambiar host y agregar https://<host>/auth/google_oauth2/callback en Google Cloud Console.
proxy:
  ssl: true
  host: 18-228-27-215.sslip.io

accessories:
  db:
    service: pis-gogrow-staging-db
    image: postgres:16
    host: 18.228.27.215
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: pis_gogrow
        POSTGRES_DB: pis_gogrow_staging
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - pis_gogrow_staging_postgres:/var/lib/postgresql/data
