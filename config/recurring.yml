production:
  benefit_usage_monthly_capture:
    class: BenefitUsageMonthlyCaptureJob
    schedule: every hour at minute 0 America/Montevideo
  benefit_usage_month_end_capture:
    class: BenefitUsageMonthEndCaptureJob
    schedule: every day at 11:55pm America/Montevideo
  benefit_usage_snapshot_retention:
    class: BenefitUsageSnapshotRetentionJob
    schedule: every day at 2am America/Montevideo
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  benefit_expiration:
    class: BenefitUpdateJob
    schedule: every day at midnight America/Montevideo
  generate_menu_schedules:
    class: MenusGenerateSchedulesJob
    schedule: every day at 3am America/Montevideo
  payment_reminders:
    class: PaymentRemindersJob
    schedule: every day at 1am America/Montevideo
  company_payment_reminders:
    class: CompanyPaymentRemindersJob
    schedule: every day at 6am America/Montevideo
  delivered_orders_sync:
    class: DeliveredOrdersSyncJob
    schedule: every day at 00:01 America/Montevideo
  employee_debt_alerts:
    class: EmployeeDebtAlertsJob
    schedule: every day at 6am America/Montevideo
  provider_menu_unpublished_reminders:
    class: ProviderMenuUnpublishedRemindersJob
    schedule: every weekday at 10:00 America/Montevideo
  provider_menu_unpublished_notifications_cleanup:
    class: ProviderMenuUnpublishedNotificationsCleanupJob
    schedule: every day at 00:05 America/Montevideo
  employee_order_reminders:
    class: EmployeeOrderRemindersJob
    schedule: every minute
  unanswered_orders_rejection:
    class: UnansweredOrdersRejectionJob
    schedule: every minute
