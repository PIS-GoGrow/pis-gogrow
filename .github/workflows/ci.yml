name: CI

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Type check
        run: npm run check

      - name: Audit npm packages for vulnerabilities
        run: npm audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_inertia_base_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost/rails_inertia_base_test
        run: bin/rails db:test:prepare spec

      - name: Check generated types are fresh
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost/rails_inertia_base_test
          TYPELIZER: "true"
        run: |
          bin/rails typelizer:generate:refresh
          git diff --exit-code -- app/javascript/routes app/javascript/types/serializers
          test -z "$(git ls-files --others --exclude-standard -- app/javascript/routes app/javascript/types/serializers)"

      - name: Check exported translations are fresh
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost/rails_inertia_base_test
        run: |
          bundle exec i18n export
          git diff --exit-code -- app/javascript/locales
          test -z "$(git ls-files --others --exclude-standard -- app/javascript/locales)"
