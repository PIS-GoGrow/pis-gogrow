# Las fixtures no disparan los callbacks de Order, así que los montos están
# escritos a mano y tienen que coincidir con las órdenes confirmadas de
# orders.yml enlazadas en order_accounts.yml.
#
# La cuenta de la empresa cobra el subsidio; la del empleado, su parte.
gogrow_tuviandita_current:
  owner: gogrow (Company)
  provider: tuviandita
  month: <%= Date.current.beginning_of_month %>
  amount: 601.00

one_tuviandita_current:
  owner: one (Consumer)
  provider: tuviandita
  month: <%= Date.current.beginning_of_month %>
  amount: 450.75

other_tuviandita_current:
  owner: other (Consumer)
  provider: tuviandita
  month: <%= Date.current.beginning_of_month %>
  amount: 150.25

# Período anterior, para ejercitar el selector de mes.
gogrow_tuviandita_previous:
  owner: gogrow (Company)
  provider: tuviandita
  month: <%= 1.month.ago.beginning_of_month %>
  amount: 900.00

# De otro proveedor: no tiene que aparecer nunca en los cobros de tuviandita.
one_endulzate_current:
  owner: one (Consumer)
  provider: endulzate
  month: <%= Date.current.beginning_of_month %>
  amount: 500.00

