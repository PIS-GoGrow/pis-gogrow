# Las fechas son relativas para que los specs no caduquen: el corte entre
# pedidos próximos e historial se define contra Date.current.
future:
  menu: milanesa
  date: <%= Date.current + 3 %>

today:
  menu: milanesa
  date: <%= Date.current %>

sorrentinos_today:
  menu: sorrentinos
  date: <%= Date.current %>

past:
  menu: milanesa
  date: <%= Date.current - 5 %>

office:
  menu: office_menu
  date: <%= Date.current + 1 %>

